name: Lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly-deprecated Renovate options
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check formatting
        run: npx --yes prettier@3 --check "*.json"
      - name: Validate Renovate config
        run: >-
          npx --yes --package renovate --
          renovate-config-validator --strict
          base.json recommended.json renovate.json
